[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "code-analysis-suite"
version = "0.2.0b2"
description = "Evidence-backed static architecture analysis for Python, JavaScript and Ruby"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Distributed Thinking Systems LLC" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pydantic>=2.12,<3",
]

[project.urls]
Homepage = "https://github.com/unixwzrd/code-analytics"
Documentation = "https://github.com/unixwzrd/code-analytics/blob/main/README.md"
Issues = "https://github.com/unixwzrd/code-analytics/issues"

[project.optional-dependencies]
tui = ["textual>=8.2,<9"]
runtime = [
  "coverage>=7.14,<8",
  "psutil>=7.2,<8",
]
javascript = [
  "tree-sitter==0.25.2",
  "tree-sitter-javascript==0.25.0",
]
semantic = [
  "sentence-transformers==5.6.0",
]
dev = [
  "black>=26.3",
  "build>=1.3",
  "mypy>=1.19",
  "types-psutil>=7.2.2.20260906,<8",
  "pytest>=9",
  "pytest-cov>=7",
  "ruff>=0.15",
]
browser = ["playwright>=1.55,<2"]
docs = ["markdown-it-py==4.0.0"]

[tool.setuptools.package-data]
code_analysis = [
  "user_help/*.html",
  "user_help/*.css",
  "user_help/index.json",
  "languages/ruby/prism_driver.rb",
  "languages/ruby/call_occurrences.rb",
  "web_static/*.html",
  "web_static/*.js",
  "web_static/*.css",
  "web_static/*.svg",
  "web_static/localops/*.js",
  "web_static/localops/*.css",
  "web_static/localops/LICENSE",
  "web_static/localops/provenance.json",
]

[project.scripts]
code-analysis = "code_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
markers = [
  "ui: browser UI and its supporting service, security, workflow and storage contracts",
  "ui_browser: module containing real-browser checks (also includes its integration tests)",
  "ui_direct_browser: case whose trusted test body explicitly invokes Playwright",
  "ui_smoke: short critical user journeys; not a substitute for full UI qualification",
]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "tests/fixtures/"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["code_analysis"]
mypy_path = "src"

[tool.pyright]
include = ["src/code_analysis", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.coverage.run]
branch = true
source = ["code_analysis"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.code-analysis]
strictness = "normal"
portable = true
